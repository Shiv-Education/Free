  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #111111;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
      text-align: center;
    }

    .brand {
      font-size: 48px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;

      margin-bottom: 30px;
    }

    .brand .shiv {
      color: #ffffff;
    }

    .brand .matka {
      display: block;
      margin-top: 7px;
      color: #ffd400;
    }

    .action-button {
      display: inline-block;

      padding: 15px 42px;

      background: #ffd400;
      color: #111111;

      border-radius: 6px;

      font-size: 17px;
      font-weight: 700;

      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .action-button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .action-button:active {
      transform: translateY(0);
    }

    .disclaimer {
      position: fixed;

      left: 15px;
      right: 15px;
      bottom: 12px;

      text-align: center;

      color: #777777;

      font-size: 10px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {

      .brand {
        font-size: 42px;
      }

      .action-button {
        padding: 14px 34px;
        font-size: 16px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <div class="brand">
      <span class="shiv">Shiv</span>
      <span class="matka">M@tka</span>
    </div>

    <a
      href="#"
      id="action-link"
      class="action-button"
    >
      Learn More
    </a>

  </main>


  <div class="disclaimer">
    Informational and awareness content only.
  </div>


  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const btn = document.getElementById("action-link");

      if (!btn) return;


      btn.addEventListener("click", function (e) {

        // Sirf real human click
        if (!e.isTrusted) {
          e.preventDefault();
          return;
        }


        // Already tracked?
        if (
          localStorage.getItem("action_tracked") === "true"
        ) {
          return;
        }


        // Mark as tracked
        localStorage.setItem(
          "action_tracked",
          "true"
        );


        // Unique event ID
        const eventId =
          "action_" + Date.now();


        // Meta Pixel event
        if (typeof fbq === "function") {

          fbq(
            "track",
            "ViewContent",
            {},
            {
              eventID: eventId
            }
          );

        }

      });

    });
  </script>

</body>
</html>
