 <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
    overflow-x: hidden;
    line-height: 1.5;
}


/* MAIN PAGE */

.bg-color {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background: #ffffff;

    padding: 20px 12px;
}


/* MAIN BOX */

.container {
    width: 100%;
    max-width: 520px;

    padding: 28px 20px;

    text-align: center;

    background: #ffffff;

    border-radius: 12px;

    border: 1px solid #eeeeee;

    box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.08);

    margin: 10px;

    position: relative;
}


/* HERO */

.hero {
    padding: 8px 0;
}


/* COLORS */

.gold {
    color: #ffc107;
}

.magenta {
    color: #e91e63;
}

.blue {
    color: #039be5;
}

.green {
    color: #00a854;
}

.purple {
    color: #7b1fa2;
}

.orange {
    color: #f4511e;
}


/* HEADING */

h1 {
    font-size: 32px;

    line-height: 1.2;

    margin-bottom: 14px;

    font-weight: 900;

    letter-spacing: 0.4px;
}


/* TEXT */

p {
    font-size: 15px;

    line-height: 1.5;

    margin: 8px 0;

    font-weight: 700;
}


/* LOGO */

.logo {
    width: 135px;
    height: 135px;

    margin: 18px auto;

    display: flex;

    align-items: center;
    justify-content: center;
}

.logo img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid #ffc107;

    box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.12);
}

.logo img:hover {
    transform: none;
}


/* BUTTON */

.cta {
    width: 100%;

    max-width: 300px;

    height: 52px;

    margin: 15px auto;

    padding: 14px 20px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    background: #039be5;

    color: #ffffff;

    border: none;

    border-radius: 6px;

    font-size: 17px;

    font-weight: 800;

    text-decoration: none;

    box-shadow:
        0 4px 12px rgba(3, 155, 229, 0.25);

    transition: opacity 0.2s ease;
}

.cta:hover {
    transform: none;

    opacity: 0.9;

    background: #039be5;

    box-shadow:
        0 4px 12px rgba(3, 155, 229, 0.25);
}


/* REMOVE BUTTON SHINE */

.cta::before {
    display: none;
}


/* FEATURE BOX */

.feature-card {
    width: 100%;

    background: #fafafa;

    padding: 13px;

    border-radius: 8px;

    margin: 9px 0;

    border: 1px solid #eeeeee;

    box-shadow: none;

    min-height: auto;

    transition: none;
}

.feature-card:hover {
    transform: none;

    box-shadow: none;
}


/* EMOJI */

.emoji {
    font-size: 22px;

    vertical-align: middle;

    margin-right: 6px;
}


/* DISCLAIMER */

.disclaimer {
    font-size: 11px;

    background: #fafafa;

    padding: 12px;

    border-radius: 8px;

    margin-top: 16px;

    border: 1px solid #e6e6e6;

    color: #555555;

    font-weight: 600;

    line-height: 1.5;
}

.disclaimer span {
    font-weight: 800;

    color: #d49f00;
}


/* REMOVE ANIMATIONS */

.hero-content,
.feature-card,
.cta {
    animation: none;
}


/* MOBILE */

@media (max-width: 768px) {

    .bg-color {
        padding: 12px 8px;
    }

    .container {
        padding: 22px 14px;

        margin: 6px;

        border-radius: 10px;
    }

    h1 {
        font-size: 28px;

        margin-bottom: 12px;
    }

    p {
        font-size: 14px;

        margin: 7px 0;
    }

    .logo {
        width: 120px;
        height: 120px;

        margin: 15px auto;
    }

    .cta {
        max-width: 280px;

        height: 50px;

        font-size: 16px;
    }

    .feature-card {
        padding: 11px;

        margin: 7px 0;
    }

    .disclaimer {
        font-size: 10px;

        padding: 10px;

        margin-top: 13px;
    }

}


/* SMALL MOBILE */

@media (max-width: 480px) {

    .container {
        padding: 20px 12px;
    }

    h1 {
        font-size: 25px;
    }

    p {
        font-size: 13px;
    }

    .logo {
        width: 105px;
        height: 105px;
    }

    .cta {
        width: 100%;

        max-width: 100%;

        height: 48px;

        font-size: 15px;
    }

    .feature-card {
        padding: 10px;
    }

    .feature-card p {
        font-size: 13px;
    }

    .disclaimer {
        font-size: 10px;
    }

}


/* VERY SMALL MOBILE */

@media (max-width: 360px) {

    h1 {
        font-size: 23px;
    }

    .logo {
        width: 95px;
        height: 95px;
    }

    .container {
        padding: 18px 10px;
    }

}

</style>

<body>

  <main class="page">

    <div class="brand">
      <span class="shiv">Shiv</span>
      <span class="matka">M@tka</span>
    </div>

    <a
      href="#"
      id="action-link"
      class="action-button"
    >
      Learn More
    </a>

  </main>


  <div class="disclaimer">
    Informational and awareness content only.
  </div>


  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const btn = document.getElementById("action-link");

      if (!btn) return;


      btn.addEventListener("click", function (e) {

        // Sirf real human click
        if (!e.isTrusted) {
          e.preventDefault();
          return;
        }


        // Already tracked?
        if (
          localStorage.getItem("action_tracked") === "true"
        ) {
          return;
        }


        // Mark as tracked
        localStorage.setItem(
          "action_tracked",
          "true"
        );


        // Unique event ID
        const eventId =
          "action_" + Date.now();


        // Meta Pixel event
        if (typeof fbq === "function") {

          fbq(
            "track",
            "ViewContent",
            {},
            {
              eventID: eventId
            }
          );

        }

      });

    });
  </script>

</body>
