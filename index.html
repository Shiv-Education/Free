<!DOCTYPE html>
<html lang="en">

  <style>

    /* RESET */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    /* BODY */

    body {
      font-family: Arial, Helvetica, sans-serif;

      background: #ffffff;

      color: #111111;

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* MAIN */

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 20px;

      text-align: center;
    }


    /* BRAND */

    .brand {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 5px;

      margin-bottom: 28px;

      font-size: 50px;

      line-height: 1;

      font-weight: 900;

      letter-spacing: -1.5px;

      white-space: nowrap;
    }


    /* SHIV */

    .shiv {
      color: #111111;
    }


    /* MATKA */

    .matka {
      color: #e91e63;
    }


    /* BUTTON */

    .action-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 220px;
      height: 52px;

      padding: 0 20px;

      background: #039be5;

      color: #ffffff;

      text-decoration: none;

      border: none;

      border-radius: 8px;

      font-size: 17px;

      font-weight: 800;

      line-height: 1;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(3, 155, 229, 0.22);

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
    }


    /* BUTTON HOVER */

    .action-button:hover {
      opacity: 0.92;

      transform: translateY(-1px);

      box-shadow:
        0 8px 22px rgba(3, 155, 229, 0.28);
    }


    /* BUTTON ACTIVE */

    .action-button:active {
      transform: translateY(0);

      box-shadow:
        0 4px 12px rgba(3, 155, 229, 0.20);
    }


    /* DISCLAIMER */

    .disclaimer {
      width: 100%;

      padding: 0 15px 16px;

      text-align: center;

      font-size: 11px;

      line-height: 1.5;

      font-weight: 600;

      color: #666666;
    }


    /* TABLET */

    @media (max-width: 768px) {

      .page {
        padding: 18px;
      }

      .brand {
        font-size: 44px;

        gap: 4px;

        margin-bottom: 26px;
      }

      .action-button {
        width: 215px;

        height: 51px;

        font-size: 16px;
      }

      .disclaimer {
        font-size: 10.5px;

        padding-bottom: 15px;
      }

    }


    /* MOBILE */

    @media (max-width: 480px) {

      .page {
        padding: 15px;
      }

      .brand {
        font-size: 38px;

        gap: 4px;

        margin-bottom: 24px;

        letter-spacing: -1px;
      }

      .action-button {
        width: 210px;

        height: 50px;

        border-radius: 7px;

        font-size: 16px;
      }

      .disclaimer {
        font-size: 10px;

        padding-left: 12px;
        padding-right: 12px;
        padding-bottom: 14px;
      }

    }


    /* SMALL MOBILE */

    @media (max-width: 360px) {

      .brand {
        font-size: 32px;

        gap: 3px;

        margin-bottom: 22px;
      }

      .action-button {
        width: 195px;

        height: 48px;

        font-size: 15px;
      }

      .disclaimer {
        font-size: 9.5px;
      }

    }


    /* VERY SMALL MOBILE */

    @media (max-width: 300px) {

      .brand {
        font-size: 28px;
      }

      .action-button {
        width: 185px;

        height: 46px;

        font-size: 14px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <div class="brand">
      <span class="shiv">Shiv</span>
      <span class="matka">M@tka</span>
    </div>


    <a
      href="#"
      id="action-link"
      class="action-button"
    >
      Learn More
    </a>

  </main>


  <div class="disclaimer">
    Informational and awareness content only.
  </div>


  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const btn = document.getElementById("action-link");

      if (!btn) return;


      btn.addEventListener("click", function (e) {

        /* Sirf real human click */
        if (!e.isTrusted) {
          e.preventDefault();
          return;
        }


        /* Already tracked */
        if (
          localStorage.getItem("action_tracked") === "true"
        ) {
          return;
        }


        /* Mark as tracked */
        localStorage.setItem(
          "action_tracked",
          "true"
        );


        /* Unique event ID */
        const eventId =
          "action_" + Date.now();


        /* Meta Pixel */
        if (typeof fbq === "function") {

          fbq(
            "track",
            "ViewContent",
            {},
            {
              eventID: eventId
            }
          );

        }

      });

    });

  </script>

</body>

</html>
